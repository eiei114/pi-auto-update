name: Publish to npm

on:
  push:
    tags:
      - "v*.*.*"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: "Release tag to publish (vX.Y.Z)"
        required: true
        type: string

concurrency:
  group: npm-publish-${{ github.event.inputs.ref || github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_ref: ${{ steps.release.outputs.ref }}
      skip: ${{ steps.published.outputs.skip }}
    steps:
      - name: Resolve release tag
        id: release
        shell: bash
        env:
          RELEASE_REF: ${{ github.event.inputs.ref || github.event.release.tag_name || github.ref_name }}
        run: |
          if ! printf '%s' "$RELEASE_REF" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Release ref must be an immutable vX.Y.Z tag: $RELEASE_REF" >&2
            exit 1
          fi
          echo "ref=$RELEASE_REF" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.release.outputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind tag to package
        shell: bash
        env:
          RELEASE_REF: ${{ steps.release.outputs.ref }}
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          test "$name" = "pi-auto-update" || { echo "Unexpected package name: $name" >&2; exit 1; }
          test "$RELEASE_REF" = "v$version" || { echo "Tag $RELEASE_REF does not match package version $version" >&2; exit 1; }
          git fetch origin main --quiet
          git merge-base --is-ancestor HEAD origin/main || { echo "$RELEASE_REF is not on origin/main" >&2; exit 1; }

      - name: Check published version
        id: published
        shell: bash
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          encoded_name="${name//\//%2F}"
          status=$(curl -sS -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/${encoded_name}/${version}")
          if [ "$status" = "200" ]; then
            echo "${name}@${version} is already published; publish intentionally skipped."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ "$status" = "404" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "Unexpected npm registry response: HTTP ${status}" >&2
            exit 1
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.15.0
          cache: npm

      - run: npm ci
      - run: npm run ci

  publish:
    needs: verify
    if: needs.verify.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verify.outputs.release_ref }}
          persist-credentials: false

      - name: Configure npm Trusted Publishing
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.15.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify Trusted Publishing support
        shell: bash
        run: |
          npm_version=$(npm --version)
          node -e "const [major, minor] = process.argv[1].split('.').map(Number); if (major < 11 || (major === 11 && minor < 5)) process.exit(1)" "$npm_version"
          echo "Using npm $npm_version from pinned Node.js 24.15.0"

      - name: Publish
        run: npm publish --access public --provenance --ignore-scripts
